<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Atlas · 关键词标注进度</title>
<style>
:root{color-scheme:light;--ink:#243044;--muted:#64748b;--line:#e1e6ee;--blue:#4772cf;--green:#3b8a77}*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:960px;margin:0 auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;gap:12px}h1{margin:0;font-size:23px;font-weight:650}#status{font-size:14px;color:var(--muted)}section{background:white;border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-top:20px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}h2{font-size:18px;margin:0;font-weight:600}.number{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.bar{height:16px;background:#edf0f6;border-radius:8px;margin:14px 0;overflow:hidden}.fill{height:100%;background:var(--blue);width:0;transition:width .4s ease}#review-fill{background:var(--green)}.small{font-size:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}.stat span{display:block;color:var(--muted);font-size:14px}.stat strong{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}footer{font-size:14px;color:var(--muted);margin-top:18px}.notice{color:#995b25;margin:12px 0 0;display:none}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.percent{font-size:16px;font-weight:400;color:var(--muted);margin-left:8px}@media(max-width:650px){main{padding:18px 16px}section{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.number{font-size:20px}header{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
@media(min-width:450px) and (max-width:650px){.stats{grid-template-columns:repeat(4,1fr)}header{flex-direction:row;align-items:center}.stat span{font-size:13px}}
</style></head><body><main>
<header><h1>Lab Atlas · 关键词标注</h1><span id="status" role="status">读取进度…</span></header>
<section><div class="row"><h2>DeepSeek 标注</h2><div class="number"><span id="annotation-number">0 / 1,673</span><span class="percent" id="annotation-percent">0.0%</span></div></div><div class="bar" role="progressbar" aria-label="关键词标注" aria-valuemin="0" aria-valuemax="1673" id="annotation-bar"><div class="fill" id="annotation-fill"></div></div><div class="small" id="cohorts">实验室 0 / 144 · 外部 0 / 1,529</div><div class="stats"><div class="stat"><span>有效标签</span><strong id="nonempty">—</strong></div><div class="stat"><span>空标签</span><strong id="empty">—</strong></div><div class="stat"><span>输入待核验</span><strong id="input-issues">0</strong></div><div class="stat"><span>未通过格式检查</span><strong id="invalid">0</strong></div></div><p id="notice" class="notice"></p></section>
<section><div class="row"><h2>6.1sol 验收</h2><div class="number"><span id="review-number">0 / 1,673</span><span class="percent" id="review-percent">0.0%</span></div></div><div class="bar" role="progressbar" aria-label="语义验收" aria-valuemin="0" aria-valuemax="1673" id="review-bar"><div class="fill" id="review-fill"></div></div><div class="stats"><div class="stat"><span>直接通过</span><strong id="passed">0</strong></div><div class="stat"><span>修正后通过</span><strong id="revised">0</strong></div><div class="stat"><span>未采用</span><strong id="needs-review">0</strong></div><div class="stat"><span>剩余</span><strong id="review-remaining">1,673</strong></div></div></section>
<footer><a id="issues-link" href="issues.html" hidden>未采用条目</a> <span id="updated">—</span> · 每3秒更新 <span id="cost"></span></footer>
</main><script>
const total=1673,n=x=>Number(x||0),fmt=x=>x.toLocaleString('zh-CN'),el=id=>document.getElementById(id),write=(id,v)=>{el(id).textContent=v};
async function read(path){try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
function bar(id,value){el(id+'-fill').style.width=Math.min(100,value/total*100)+'%';el(id+'-bar').setAttribute('aria-valuenow',value);write(id+'-number',fmt(value)+' / '+fmt(total));write(id+'-percent',(value/total*100).toFixed(1)+'%')}
async function tick(){const[p,v,s,summary]=await Promise.all([read('control/progress.json'),read('control/validation-report.json'),read('control/process-status.json'),read('control/summary.json')]);if(!p){write('status','等待标注启动');return}const c=p.counts||{},done=n(c.done)+n(c.flag_for_review);bar('annotation',done);write('input-issues',fmt(n(c.flag_for_review)));write('invalid',fmt(n(c.invalid)));const ids=[...(p.paper_ids?.done||[]),...(p.paper_ids?.flag_for_review||[])],lab=ids.filter(id=>id.startsWith('lab-')).length;write('cohorts','实验室 '+fmt(lab)+' / 144 · 外部 '+fmt(done-lab)+' / 1,529');const r=v?.review_counts||{},pass=n(r.review_pass),rev=n(r.review_revised),needs=n(r.review_needs_review),bad=n(r.review_invalid),examined=pass+rev+needs+bad;bar('review',examined);write('passed',fmt(pass));write('revised',fmt(rev));write('needs-review',fmt(needs));write('review-remaining',fmt(total-examined));write('nonempty',fmt(n(v?.counts?.valid_nonempty)));write('empty',fmt(n(v?.counts?.valid_empty)));const stopped=p.stop_reason,labels={insufficient_balance:'API余额不足；已保存进度，充值后可续跑。',authentication_failed:'API认证失败；已保存进度。',budget_limit:'达到本轮预算上限；已保存进度。',input_freeze_changed:'输入文件发生变化；已暂停。'};el('notice').style.display=stopped?'block':'none';write('notice',labels[stopped]||stopped||'');write('status',stopped?(examined<done?'标注暂停 · 验收中':'标注暂停'):done===total?(examined===total?(needs||bad?'已完成 · '+fmt(needs+bad)+' 篇未采用':'已完成'):'验收中'):(s?.status==='exited'?'本轮已结束':'标注中'));write('updated','结果更新 '+new Date(v?.generated_at||p.generated_at).toLocaleTimeString('zh-CN',{hour12:false}));el('issues-link').hidden=!summary;write('cost',summary?.review_finished?' · 标注累计估算 $'+summary.estimated_annotation_cost_usd.toFixed(3):typeof p.cost_usd_this_run==='number'?' · 本轮估算 $'+p.cost_usd_this_run.toFixed(3):'')}
tick();setInterval(tick,3000);
</script></body></html>
