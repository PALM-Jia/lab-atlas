<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="实验室论文与全球文献邻域的多维关系地图" />
    <title>Lab Atlas · 实验室论文地图</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="panel-layout.css" />
    <link rel="stylesheet" href="theme.css" />
    <script defer src="cytoscape.min.js"></script>
    <script defer src="data.js"></script>
    <script defer src="node-shadows.js"></script>
    <script defer src="panel-layout.js"></script>
    <script defer src="dynamic-layout.js"></script>
    <script defer src="author-identities.js"></script>
    <script defer src="author-groups.js"></script>
    <script defer src="author-identity-resolver.js"></script>
    <script defer src="author-affiliations.js"></script>
    <script defer src="paper-author-interest.js"></script>
    <script defer src="paper-keywords.js"></script>
    <script defer src="paper-fields.js"></script>
    <script defer src="paper-density.js"></script>
    <script defer src="keyword-relations.js"></script>
    <script defer src="author-keywords.js"></script>
    <script defer src="author-relations.js"></script>
    <script defer src="citation-history.js"></script>
    <script defer src="timeline-history.js"></script>
    <script defer src="timeline-3d.js"></script>
    <script defer src="network-evidence.js"></script>
    <script defer src="network-evidence-ui.js"></script>
    <script defer src="search-match.js"></script>
    <script defer src="node-sizes.js"></script>
    <script defer src="app.js"></script>
    <script defer src="atlas-navigation.js"></script>
  </head>
  <body>
    <header class="header atlas-header">
      <a class="brand atlas-brand" href="index.html"
        ><span class="brand-mark">✳</span><span>Lab Atlas</span></a
      >
      <nav class="atlas-nav" aria-label="主要导航">
        <a href="index.html" aria-current="page">可视化</a>
        <a href="retrieval.html">检索汇总</a>
        <a href="workflow.html">处理流程</a>
      </nav>
      <button id="about" class="quiet" type="button">数据说明</button>
    </header>
    <main id="workspace" class="workspace">
      <button
        id="toggle-sidebar"
        class="panel-edge sidebar-edge"
        aria-controls="sidebar"
        aria-expanded="true"
        aria-label="收起筛选栏"
      >
        ‹</button
      ><button
        id="toggle-details"
        class="panel-edge details-edge"
        aria-controls="details"
        aria-expanded="true"
        aria-label="收起详情栏"
      >
        ›
      </button>
      <aside id="sidebar" class="sidebar">
        <h1>筛选</h1>
        <div class="stats">
          <div><strong id="lab-count">—</strong><span>实验室论文</span></div>
          <div><strong id="external-count">—</strong><span>外部文献</span></div>
        </div>
        <label class="search-label" for="search">搜索论文或作者</label>
        <input
          id="search"
          type="search"
          placeholder="标题、作者、关键词…"
          autocomplete="off"
        />
        <div id="first-author-option" class="hidden">
          <button
            id="first-author-only"
            type="button"
            class="topic category-state"
            role="checkbox"
            title="切换署名贡献：全部、弱化非一作、仅一作"
          ></button>
        </div>
        <div class="year-filter">
          <div class="year-heading"><span>年份区间</span></div>
          <div id="year-range" class="year-range">
            <div class="year-track" aria-hidden="true"></div>
            <input id="year-from" type="range" aria-label="起始年份" step="1" />
            <input id="year-to" type="range" aria-label="结束年份" step="1" />
          </div>
          <div id="year-ticks" class="year-ticks" aria-hidden="true"></div>
        </div>
        <label id="external-option" class="check"
          ><input id="external" type="checkbox" checked /><span
            id="external-label"
            >显示外部文献</span
          ></label
        >
        <div class="section-label">
          <span id="category-heading">研究领域</span>
          <button id="clear-topic" class="text-button">全部显示</button>
        </div>
        <div id="topics" class="topics"></div>

        <div id="paper-author-panel">
          <div class="section-label">
            作者分类 <button id="care-all" class="text-button">全部关心</button>
          </div>
          <div id="paper-author-interest" class="topics"></div>
          <p class="detail-note">保留含关心作者的论文及其外部关联文献。</p>
        </div>
        <div class="sidebar-bottom">
          <a
            href="https://jyh-learning.github.io/papers.html"
            target="_blank"
            rel="noopener"
            >查看原始论文列表 ↗</a
          >
        </div>
      </aside>
      <section class="explorer" aria-label="论文关系图">
        <div class="toolbar">
          <div class="views" role="group" aria-label="视图">
            <button data-view="authors">作者</button
            ><button data-view="papers" class="active">论文</button
            ><button data-view="timeline">时间脉络</button>
          </div>
          <div class="relation-bar">
            <select id="relation" aria-label="关联依据" title="关联依据">
              <option value="citation">直接引用</option>
              <option value="author">共同作者</option>
              <option value="semantic">标题与摘要相似</option>
              <option value="keyword">论文关键词重合</option></select
            ><select
              id="author-relation"
              class="hidden"
              aria-label="作者关联依据"
              title="关联依据"
            >
              <option value="coauthor">共同署名</option>
              <option value="semantic">标题与摘要相似</option>
              <option value="keywords">论文关键词分布相似</option></select
            ><label id="hub-option" class="check hidden"
              ><input id="hub" type="checkbox" /><span id="hub-label"
                >包含 Yuheng Jia</span
              ></label
            >
          </div>
          <button
            id="reset"
            class="quiet"
            title="随机重新排布当前网络，保留筛选与视图"
          >
            重置
          </button>
        </div>
        <div class="graph-wrap">
          <canvas id="node-shadows" aria-hidden="true"></canvas>
          <div id="graph"></div>
          <canvas
            id="timeline-3d"
            class="hidden"
            aria-label="年度论文树：正射投影，横向拖动旋转，纵向拖动俯仰，滚轮切换最上方年份，Shift 拖动平移"
            tabindex="0"
          ></canvas>
          <div id="author-labels" class="author-labels"></div>
          <div id="node-preview" class="node-preview hidden"></div>
          <div id="empty" class="empty hidden"></div>
          <div
            id="timeline-controls"
            class="timeline-controls hidden"
            role="group"
            aria-label="绕年份轴旋转"
          >
            <button
              id="timeline-rotate-left"
              class="quiet"
              aria-label="向左旋转十五度"
            >
              ↶</button
            ><label for="timeline-rotation">旋转</label
            ><input
              id="timeline-rotation"
              type="range"
              min="-180"
              max="180"
              value="0"
              step="1"
              aria-label="绕年份轴旋转角度"
            /><button
              id="timeline-rotate-right"
              class="quiet"
              aria-label="向右旋转十五度"
            >
              ↷
            </button>
          </div>
          <div class="zoom">
            <button id="zoom-in" aria-label="放大">＋</button
            ><button id="zoom-out" aria-label="缩小">−</button
            ><button id="fit" aria-label="适应画布">⌖</button>
          </div>
          <div class="graph-footer">
            <span id="visible-count"></span
            ><span id="graph-help" class="graph-help">滚轮缩放 · 拖拽平移</span
            ><span id="updated"></span>
          </div>
        </div>
      </section>
      <aside id="details" class="details" aria-live="polite">
        <div class="detail-head">
          <span>详情</span
          ><button id="clear-selection" class="text-button" hidden>清除</button>
        </div>
        <section
          id="relation-explanation"
          class="relation-explanation"
          aria-label="当前关联依据"
        ></section>
        <div id="detail-content"></div>
      </aside>
    </main>
    <dialog id="info">
      <button id="close-info" class="quiet">关闭 ×</button>
      <h2>数据来源与覆盖范围</h2>
      <div id="info-content"></div>
    </dialog>
  </body>
</html>
